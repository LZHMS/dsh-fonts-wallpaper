<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b4a"/>
      <stop offset="1" stop-color="#31607f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#101527" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1280" height="620" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <rect x="120" y="50" width="1040" height="520" rx="16" fill="rgba(16,22,40,0.9)" stroke="rgba(120,150,220,0.35)"/>
    <text x="150" y="92" font-size="17" fill="#e6ecf6" font-weight="700">Fonts &amp; wallpaper panel</text>
    <text x="150" y="114" font-size="12" fill="rgba(170,182,204,0.8)">three areas · Latin + CJK per area · every row previews in its own face</text>

    <!-- Interface card -->
    <g>
      <rect x="150" y="136" width="980" height="118" rx="12" fill="rgba(30,40,66,0.75)"/>
      <text x="170" y="164" font-size="13" fill="#7fd1c1" font-weight="700">Interface</text>
      <rect x="170" y="176" width="220" height="26" rx="6" fill="rgba(52,66,100,0.9)"/>
      <text x="182" y="194" font-size="12" fill="#cfd8ea" font-family="Georgia, serif">Georgia (Latin)</text>
      <rect x="400" y="176" width="220" height="26" rx="6" fill="rgba(52,66,100,0.9)"/>
      <text x="412" y="194" font-size="12" fill="#cfd8ea" font-family="KaiTi, STKaiti, serif">楷体 (CJK)</text>
      <text x="170" y="234" font-size="19" fill="#e6ecf6" font-family="Georgia, serif">The quick brown fox</text>
      <text x="470" y="234" font-size="19" fill="#e6ecf6" font-family="KaiTi, STKaiti, serif">永字八法 · ABCDEFG 0123456789</text>
    </g>

    <!-- Conversation card -->
    <g>
      <rect x="150" y="266" width="980" height="118" rx="12" fill="rgba(30,40,66,0.75)"/>
      <text x="170" y="294" font-size="13" fill="#7fd1c1" font-weight="700">Conversation</text>
      <rect x="170" y="306" width="220" height="26" rx="6" fill="rgba(52,66,100,0.9)"/>
      <text x="182" y="324" font-size="12" fill="#cfd8ea" font-family="Verdana, sans-serif">Verdana (Latin)</text>
      <rect x="400" y="306" width="220" height="26" rx="6" fill="rgba(52,66,100,0.9)"/>
      <text x="412" y="324" font-size="12" fill="#cfd8ea" font-family="Microsoft YaHei, sans-serif">雅黑 (CJK)</text>
      <text x="170" y="364" font-size="19" fill="#e6ecf6" font-family="Verdana, sans-serif">jumpy fox helps vault wid</text>
      <text x="500" y="364" font-size="19" fill="#e6ecf6" font-family="Microsoft YaHei, sans-serif">永字八法 · ABCDEFG 0123456789</text>
    </g>

    <!-- Code card -->
    <g>
      <rect x="150" y="396" width="980" height="118" rx="12" fill="rgba(30,40,66,0.75)"/>
      <text x="170" y="424" font-size="13" fill="#7fd1c1" font-weight="700">Code</text>
      <rect x="170" y="436" width="220" height="26" rx="6" fill="rgba(52,66,100,0.9)"/>
      <text x="182" y="454" font-size="12" fill="#cfd8ea" font-family="Consolas, monospace">Consolas (mono)</text>
      <text x="170" y="494" font-size="17" fill="#a8d8ff" font-family="Consolas, monospace">const answer = 6 * 9;  // 永字八法 01</text>
    </g>
  </g>

  <text x="120" y="600" font-size="12" fill="rgba(238,243,252,0.75)">font pickers read the machine's installed families (1,200+ searchable) — examples above use common system fonts</text>
</svg>
