<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="wp" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#233457"/>
      <stop offset="0.5" stop-color="#4d7fff"/>
      <stop offset="1" stop-color="#7fd1c1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#101527" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1280" height="760" fill="url(#wp)"/>

  <!-- app window over the wallpaper, tinted through -->
  <g filter="url(#sh)">
    <rect x="90" y="60" width="1100" height="640" rx="14" fill="rgba(16,21,39,0.55)"/>
    <!-- title strip -->
    <rect x="90" y="60" width="1100" height="38" rx="14" fill="rgba(10,14,26,0.5)"/>
    <circle cx="116" cy="79" r="6" fill="#ff5f57"/><circle cx="134" cy="79" r="6" fill="#febc2e"/><circle cx="152" cy="79" r="6" fill="#28c840"/>
    <text x="620" y="84" text-anchor="middle" font-size="13" fill="rgba(230,236,246,0.8)">DeepSeek Harness — with a global wallpaper</text>

    <!-- sidebar -->
    <rect x="90" y="98" width="240" height="602" fill="rgba(13,18,32,0.62)"/>
    <g font-size="12" fill="rgba(214,222,236,0.85)">
      <rect x="108" y="120" width="204" height="26" rx="7" fill="rgba(120,150,220,0.28)"/><text x="120" y="138">＋ New session</text>
      <text x="112" y="178">Plugins</text>
      <text x="112" y="206">Fonts &amp; wallpaper</text>
      <rect x="104" y="192" width="4" height="18" rx="2" fill="#7fd1c1"/>
      <text x="112" y="234">Automations</text>
      <text x="112" y="262">Workspace</text>
      <text x="112" y="290">Plugin market</text>
      <text x="112" y="676">user</text>
    </g>

    <!-- conversation column -->
    <g>
      <rect x="360" y="130" width="420" height="70" rx="12" fill="rgba(47,111,237,0.55)"/>
      <text x="380" y="160" font-size="13" fill="#eef3ff">Make the whole app sit on top of</text>
      <text x="380" y="180" font-size="13" fill="#eef3ff">this wallpaper, please.</text>
      <rect x="360" y="222" width="520" height="84" rx="12" fill="rgba(20,28,48,0.72)"/>
      <text x="380" y="252" font-size="12.5" fill="rgba(214,222,236,0.9)">✓ Wallpapers can come from a local file or a URL;</text>
      <text x="380" y="272" font-size="12.5" fill="rgba(214,222,236,0.9)">opacity is live-adjustable and persists across</text>
      <text x="380" y="292" font-size="12.5" fill="rgba(214,222,236,0.9)">restarts — every pane stays tinted-through.</text>
      <rect x="360" y="620" width="740" height="52" rx="12" fill="rgba(16,22,40,0.75)"/>
      <text x="380" y="651" font-size="12" fill="rgba(170,180,200,0.8)">Describe what you want to build…</text>
    </g>

    <!-- right panel: Fonts & wallpaper -->
    <g>
      <rect x="840" y="120" width="310" height="470" rx="14" fill="rgba(16,22,40,0.86)" stroke="rgba(120,150,220,0.35)"/>
      <text x="860" y="150" font-size="14" fill="#e6ecf6" font-weight="700">Fonts &amp; wallpaper</text>

      <rect x="860" y="168" width="270" height="76" rx="10" fill="rgba(30,40,66,0.85)"/>
      <text x="872" y="188" font-size="11" fill="rgba(190,200,220,0.9)">Interface</text>
      <rect x="872" y="196" width="120" height="20" rx="5" fill="rgba(52,66,100,0.9)"/><text x="880" y="210" font-size="10" fill="#cfd8ea">Latin…</text>
      <rect x="1002" y="196" width="120" height="20" rx="5" fill="rgba(52,66,100,0.9)"/><text x="1010" y="210" font-size="10" fill="#cfd8ea">CJK…</text>
      <text x="872" y="236" font-size="13" fill="#7fd1c1">ABCDEFG abcdefg 0123</text>

      <rect x="860" y="254" width="270" height="76" rx="10" fill="rgba(30,40,66,0.85)"/>
      <text x="872" y="274" font-size="11" fill="rgba(190,200,220,0.9)">Conversation</text>
      <rect x="872" y="282" width="120" height="20" rx="5" fill="rgba(52,66,100,0.9)"/><text x="880" y="296" font-size="10" fill="#cfd8ea">Latin…</text>
      <rect x="1002" y="282" width="120" height="20" rx="5" fill="rgba(52,66,100,0.9)"/><text x="1010" y="296" font-size="10" fill="#cfd8ea">CJK…</text>
      <text x="872" y="322" font-size="13" fill="#7fd1c1">永字八法 ABCDEFG 0123</text>

      <rect x="860" y="340" width="270" height="76" rx="10" fill="rgba(30,40,66,0.85)"/>
      <text x="872" y="360" font-size="11" fill="rgba(190,200,220,0.9)">Code</text>
      <rect x="872" y="368" width="240" height="20" rx="5" fill="rgba(52,66,100,0.9)"/><text x="880" y="382" font-size="10" fill="#cfd8ea">mono…</text>
      <text x="872" y="408" font-size="12" fill="#7fd1c1" font-family="Consolas,monospace">const x = 42;</text>

      <!-- wallpaper card -->
      <rect x="860" y="426" width="270" height="104" rx="10" fill="rgba(30,40,66,0.85)"/>
      <text x="872" y="446" font-size="11" fill="rgba(190,200,220,0.9)">Wallpaper</text>
      <rect x="872" y="454" width="150" height="22" rx="5" fill="rgba(52,66,100,0.9)"/><text x="880" y="469" font-size="9.5" fill="#cfd8ea">URL or local file…</text>
      <rect x="1032" y="454" width="90" height="22" rx="5" fill="rgba(52,66,100,0.9)"/><text x="1042" y="469" font-size="10" fill="#cfd8ea">Browse…</text>
      <rect x="872" y="486" width="246" height="6" rx="3" fill="rgba(90,110,150,0.7)"/>
      <circle cx="990" cy="489" r="7" fill="#7fd1c1"/>
      <text x="872" y="512" font-size="9.5" fill="rgba(170,182,204,0.8)">opacity — live, persists across restarts</text>

      <!-- preset chips -->
      <g>
        <rect x="872" y="540" width="76" height="36" rx="6" fill="linear"/>
        <rect x="872" y="540" width="76" height="36" rx="6"/>
        <rect x="872" y="540" width="76" height="36" rx="6" fill="url(#p1)"/>
        <rect x="956" y="540" width="76" height="36" rx="6" fill="url(#p2)"/>
        <rect x="1040" y="540" width="76" height="36" rx="6" fill="url(#p3)"/>
        <text x="872" y="592" font-size="9.5" fill="rgba(170,182,204,0.8)">three bundled gradient presets · pick, replace or remove</text>
      </g>
    </g>
  </g>

  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#233457"/><stop offset="1" stop-color="#7fd1c1"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a52"/><stop offset="1" stop-color="#f2a65e"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf7ee"/><stop offset="1" stop-color="#5cb896"/></linearGradient>
  </defs>

  <text x="90" y="736" font-size="13" fill="rgba(238,243,252,0.92)" font-weight="700">dsh-fonts-wallpaper</text>
  <text x="320" y="736" font-size="12" fill="rgba(238,243,252,0.72)">global wallpaper (file / URL · live opacity) · per-area fonts with Latin + CJK pickers and live previews · 1,200+ local faces searchable</text>
</svg>
